server {
    listen 80;
    server_name _;
    # Plaintext HTTP is intercepted and rewritten on some network paths (Iranian
    # filtering answers JS bundle requests with a 302 to 10.10.34.35), which
    # leaves the page a dead shell. TLS is a correctness requirement here.
    return 301 https://$host$request_uri;
}

server {
    # "listen 443 ssl http2" rather than the newer "http2 on;" directive, which
    # only exists from nginx 1.25.1 — Ubuntu 24.04 ships 1.24.
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/polyp.crt;
    ssl_certificate_key /etc/nginx/ssl/polyp.key;

    client_max_body_size 500M;

    # Frontend and API share one origin: no CORS, no mixed content, and the
    # WebSocket inherits the same certificate the page was loaded over.
    location /api/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # A live session holds the inference socket open for the whole procedure.
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
    }

    location / {
        proxy_pass http://127.0.0.1:__FRONTEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
